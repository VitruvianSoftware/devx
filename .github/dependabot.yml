# Dependabot configuration for the devx repo.
#
# Two ecosystems are watched HERE:
#   1. github-actions — every workflow under .github/workflows/
#   2. npm            — the VitePress docs site (docs/)
# Go modules (gomod) are NOT watched here — they are centralized in the
# vitruvian-core monorepo's root .github/dependabot.yml and fan out to this repo
# via the Copybara export (see docs/copybara-bidi-sync.md).
#
# Strategy:
#   - Minor + patch updates are grouped into a single weekly PR per ecosystem,
#     so we get at most 2 grouped PRs/week (one per ecosystem) plus
#     individual PRs for any major-version bumps that need human review.
#   - Commit messages use Conventional Commits style (chore(deps): ...) so
#     release-please correctly categorises them and they don't pollute the
#     CHANGELOG's feat/fix sections.
#   - open-pull-requests-limit caps the queue so dependabot can't flood the
#     PR list if a backlog accumulates.

version: 2
updates:
  # ─── GitHub Actions workflows ──────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ─── VitePress docs site ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "chore(docs)"
      include: "scope"
    groups:
      docs-minor-patch:
        update-types:
          - "minor"
          - "patch"
