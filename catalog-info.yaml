# Machine-readable app metadata (#500): the single per-app source for
# ownership, deploy identity, and release model. Backstage-compatible
# Component; consumed today by tools/conformance (owner must match
# .github/CODEOWNERS) and by humans/agents doing impact analysis.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devx
  description: Developer-experience CLI — local dev orchestration (Lima VMs, devcontainers, k3s cluster join/apply, scaffolding)
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
    # Single word => matched as a Grafana TAG (case-sensitive).
    # Currently resolves to: devx Build Metrics
    grafana/dashboard-selector: devx
    vitruvian.dev/release-workflow: apps-release.yml
    vitruvian.dev/release-model: goreleaser
    vitruvian.dev/mirror: VitruvianSoftware/devx
  links:
    - url: https://github.com/VitruvianSoftware/devx
      title: GitHub Mirror
      icon: github
    - url: https://github.com/VitruvianSoftware/devx/releases
      title: Releases (GoReleaser)
      icon: card_giftcard
    - url: https://grafana.lab.ipv1337.dev/d/devx
      title: Grafana Build Metrics
      icon: dashboard
spec:
  type: tool
  lifecycle: production
  owner: devx-team
  system: devx-suite
